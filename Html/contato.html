<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Contato - SoftWear</title>
  <link rel="stylesheet" href="/CSS/style.css">
</head>
<body>
  <header>
<div class="Externo header-inner">
      <a href="index.html">
        <div class="logo"><img src="../imagens/logo.png" alt="SoftWear"></div>
      </a>
      <nav>
        <ul>
          <li><a href="index.html">Início</a></li>
          <li><a href="produtos.html">Produtos</a></li>
          <li><a href="contato.html">Contato</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="section">
      <h2>Faça Seu Pedido</h2>
      <div class="form" role="form">
        <form>
          <label for="nome">Nome:</label>
          <input id="nome" type="text" required>
          <label for="email">Email:</label>
          <input id="email" type="email" required>
          <label for="numero">Numero:</label>
          <input type="tel" id="ddd" maxlength="2" placeholder="DDD" required>
          <input id="numero" type="tel" maxlength="9"  placeholder="Número" required><br><br>
          <label for="mensagem">Mensagem:</label>
          <textarea id="mensagem" rows="5" required></textarea>
          <button type="submit">Enviar</button>
        </form>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 SoftWear - Todos os direitos reservados.</p>
  </footer>
</body>
</html>
